name: "Installation or usage help"
description: "Ask for help setting up or using a Simar skill."
body:
  - type: markdown
    attributes:
      value: "Use fictional examples. Do not share client documents, identifiers, credentials or unredacted screenshots."
  - type: textarea
    id: request
    attributes:
      label: "What are you trying to do?"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: AI application, version and operating system
      placeholder: "For example: Gemini CLI version, macOS version"
  - type: textarea
    id: details
    attributes:
      label: Steps, installation method, error or proposed solution
      description: "Include relevant primary-source links and redact private information."
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: "I have removed private case information and credentials."
          required: true
